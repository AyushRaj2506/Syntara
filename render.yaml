services:
  # 1. Syntara Backend Web Service (Express + Socket.IO)
  - type: web
    name: syntara-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: CLIENT_ORIGIN
        sync: false
      - key: ROOM_CLEANUP_INTERVAL_MS
        value: 60000
      - key: MAX_ROOMS_PER_IP_PER_HOUR
        value: 10

  # 2. Syntara Frontend Static Site (Vite React SPA)
  - type: web
    name: syntara-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        sync: false
